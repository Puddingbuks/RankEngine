# Redirect www → non-www
server {
    listen 80;
    server_name www.rankengine.nl;
    return 301 https://rankengine.nl$request_uri;
}

server {
    listen 80;
    server_name rankengine.nl _;
    root /usr/share/nginx/html;
    index index.html;

    # Achter Cloudflare Tunnel: relatieve redirects, anders wijst een
    # directory-redirect (/blog -> /blog/) naar http:// in plaats van https://
    absolute_redirect off;

    # 301: directe .html-aanroepen naar de canonieke extensieloze URL.
    # Gebruikt $request_uri (de originele client-aanvraag) i.p.v. location-
    # matching op $uri: de `index`-directive hierboven doet zelf ook een
    # interne herschrijving naar index.html, en location-blocks zouden die
    # interne herschrijving evengoed herschrijven -> oneindige redirect-loop
    # op "/". $request_uri blijft ongewijzigd bij zo'n interne herschrijving.
    if ($request_uri ~ ^(.*/)index\.html($|\?)) {
        return 301 $1;
    }
    if ($request_uri ~ ^/(?!bedankt\.html|404\.html)([^?]+)\.html($|\?)) {
        return 301 /$1;
    }

    # AI Second Brain verhuisd naar het eigen subdomein
    location ~ ^/ai-second-brain/?$ {
        return 301 https://ai.rankengine.nl/;
    }

    # Contactformulier doorsturen naar N8N op de host
    location /api/contact {
        proxy_pass http://host.docker.internal:5678/webhook/rankengine-contact;
        proxy_set_header Content-Type application/json;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache headers voor statische assets
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML: geen cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Onbekende paden -> 404.html
    location / {
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /404.html;
    }

    # Verberg .git en verborgen mappen
    location ~ /\. {
        deny all;
    }

    # Verberg deployscripts/infra-config en repo-instructies (horen niet publiek)
    location /deploy/ {
        deny all;
    }
    location = /CLAUDE.md {
        deny all;
    }

    # ai-site wordt via het eigen ai.rankengine.nl-serverblok hieronder ontsloten,
    # niet dubbel via rankengine.nl/ai-site/
    location /ai-site/ {
        deny all;
    }
}

# ── ai.rankengine.nl: dedicated subdomein voor de AI Second Brain-dienst
server {
    listen 80;
    server_name ai.rankengine.nl;
    root /usr/share/nginx/html/ai-site;
    index index.html;

    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /404.html;
    }

    location ~ /\. {
        deny all;
    }
}

